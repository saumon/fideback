<!doctype html>
<html lang="fr">
  <head>
    <title>Erreur (500) · Fideback</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: #F7F5FC;
        color: #231942;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      main { max-width: 34rem; padding: 2rem; background: #FFFFFF; border: 2px solid #231942; border-radius: 1.5rem; box-shadow: 8px 8px 0 #FF5D8F; }
      .code { margin: 0 0 0.5rem; color: #5A5378; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
      h1 { margin: 0 0 0.75rem; font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; }
      p { margin: 0 0 1rem; }
      a { color: #231942; font-weight: 600; text-decoration-color: #FF5D8F; text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Erreur 500</p>
      <h1>Une erreur est survenue de notre côté.</h1>
      <p>Réessayez dans quelques instants.</p>
      <p><a href="/">Revenir à l'accueil de Fideback</a></p>
    </main>
  </body>
</html>
