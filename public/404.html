<!doctype html>
<html lang="fr">
  <head>
    <title>Page introuvable (404) · Fideback</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: #F7F8F6;
        color: #16222E;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      main { max-width: 34rem; padding-left: 1.5rem; border-left: 1px solid #E4ECF4; }
      .code { margin: 0 0 0.5rem; color: #5E6D7C; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
      h1 { margin: 0 0 0.75rem; font-family: Georgia, "Times New Roman", serif; font-size: 2rem; line-height: 1.15; }
      p { margin: 0 0 1rem; }
      a { color: #2F5D8C; text-underline-offset: 0.2em; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Erreur 404</p>
      <h1>Cette page n'existe pas.</h1>
      <p>L'adresse est peut-être mal saisie, ou la page a été déplacée. Si vous suivez un lien de feedback, vérifiez qu'il est complet.</p>
      <p><a href="/">Revenir à l'accueil de Fideback</a></p>
    </main>
  </body>
</html>
